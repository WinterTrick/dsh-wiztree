name: release

# Push a tag such as v1.0.0 to validate, pack, and attach the tarball to a
# GitHub Release. Distribution is GitHub-only: this project is not published
# to npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate bundle
        run: npm run check
      - name: Pack
        run: npm pack
      - name: Prepare release assets
        # A version-free name keeps `releases/latest/download/dsh-wiztree.tgz`
        # valid across releases; the versioned copy is for pinned links.
        run: cp dsh-wiztree-*.tgz dsh-wiztree.tgz
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-wiztree-*.tgz
            dsh-wiztree.tgz
          generate_release_notes: true
